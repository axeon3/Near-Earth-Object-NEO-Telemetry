name: CodeQL Analysis & Telemetry Workflow

on:
  push:
      branches: [ "main" ]
        pull_request:
            branches: [ "main" ]
              schedule:
                  - cron: '0 0 * * 0'

                  jobs:
                    analyze:
                        name: Analyze CodeQL
                            runs-on: ubuntu-latest
                                permissions:
                                      actions: read
                                            contents: read
                                                  security-events: write

                                                      steps:
                                                          - name: Checkout repository
                                                                uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

                                                                    - name: Initialize CodeQL
                                                                          uses: github/codeql-action/init@afb54da396e800d45747b003a7493a778e3c1a2e # v3.26.10
                                                                                with:
                                                                                        languages: javascript-typescript

                                                                                            - name: Perform CodeQL Analysis
                                                                                                  uses: github/codeql-action/analyze@afb54da396e800d45747b003a7493a778e3c1a2e # v3.26.10
                                                                                                  version: 2
                                                                                                  updates:
                                                                                                    - package-ecosystem: "github-actions"
                                                                                                        directory: "/"
                                                                                                            schedule:
                                                                                                                  interval: "weekly"
                                                                                                                  
