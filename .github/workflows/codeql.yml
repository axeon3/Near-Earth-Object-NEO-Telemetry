name: "CodeQL Analysis"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '30 1 * * *' # Runs automatically every day at 01:30 UTC

jobs:
  analyze:
    name: Analyze Code
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write # Required for GitHub token authentication to write scan alerts

    strategy:
      fail-fast: false
      matrix:
        # Update this list to match the languages used in your project
        # Supported options: c-cpp, csharp, go, java-kotlin, javascript-typescript, python, ruby, swift
        language: [ 'javascript-typescript', 'python' ]

    steps:
    # Pinned to actions/checkout v4.2.2
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    # Pinned to github/codeql-action v3
    - name: Initialize CodeQL
      uses: github/codeql-action/init@6bb034416e761252ac92b3dd6706e9215858232a # v3
      with:
        languages: ${{ matrix.language }}
        queries: security-extended,security-and-quality

    - name: Autobuild
      uses: github/codeql-action/autobuild@6bb034416e761252ac92b3dd6706e9215858232a # v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@6bb034416e761252ac92b3dd6706e9215858232a # v3
      with:
        category: "/language:${{matrix.language}}"
