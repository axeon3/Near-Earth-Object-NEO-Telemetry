name: "CodeQL Telemetry Hardening & Security Analysis"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run every Sunday at 04:00 UTC to catch newly disclosed vulnerabilities (CVEs)
    - cron: '0 4 * * *'

# Ensure only one CodeQL run per branch/PR at a time to optimize runner resources
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Explicit least-privilege scoping
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: actions
            build-mode: { actions : autobuild }

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Initializes the CodeQL tools and sets query suite
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # 'security-and-quality' activates deep hardening checks, precision arithmetic checks,
          # and security vulnerability rules beyond basic security queries
          queries: security-and-quality

      # Autobuild attempts to build any compiled languages if needed
      - name: Perform Autobuild
        uses: github/codeql-action/autobuild@v3

      # Executes the CodeQL AST and data-flow analysis
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          upload: true
